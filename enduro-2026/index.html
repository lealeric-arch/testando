<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0b14;
    color: #e8f0ff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #1a2038 0%, #070810 72%);
  }
  #stage {
    position: relative;
    image-rendering: auto;
    box-shadow:
      0 0 0 6px #2a2d3a, 0 0 0 9px #16171f,
      0 0 46px rgba(80,120,255,.22), 0 22px 60px rgba(0,0,0,.65);
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  canvas { display: block; image-rendering: auto; }
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%);
  }
  /* Touch controls */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: none; }
  .pad {
    position: absolute; bottom: 22px;
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(40,60,140,.35);
    border: 3px solid rgba(120,160,255,.6);
    display: flex; align-items: center; justify-content: center;
    color: #cfe0ff; font-size: 30px; font-weight: bold;
    pointer-events: auto; backdrop-filter: blur(2px);
  }
  .pad:active { background: rgba(90,130,255,.6); }
  #bLeft { left: 18px; }
  #bRight { left: 116px; }
  #bBrake { right: 116px; background: rgba(180,50,60,.35); border-color: rgba(255,120,120,.6); }
  #bGas   { right: 18px; background: rgba(50,180,90,.35); border-color: rgba(120,255,150,.6); }
  #bNitro { right: 62px; bottom: 116px; width: 66px; height: 66px; font-size: 15px;
            background: rgba(50,110,255,.4); border-color: rgba(140,200,255,.7); color:#dff0ff; }
  @media (pointer: coarse) { #touch { display: block; } }
  #hint {
    position: fixed; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: #6b78b5; letter-spacing: 1px; z-index: 5;
  }
</style>

"use strict";

// ---------------------------------------------------------------------------
// ENDURO 2026 — Turbo Racer (pseudo-3D, pegada Need for Speed)
// Seleção de carro · perseguição policial (heat/procurado) · drift com pontos ·
// minimapa + posição na pista · chuva com reflexos no asfalto · nitro · som.
// ---------------------------------------------------------------------------

const W = 384, H = 240;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
cv.width = W; cv.height = H;

// W,H are LOGICAL design units. The canvas backbuffer is supersampled to a much
// higher pixel count (high-DPI) and the whole scene is drawn scaled by SUP, so
// everything stays razor-sharp on big/4K displays while the code keeps using W,H.
let SUP = 1;
function resize() {
  const pad = 24;
  const scale = Math.max(1, Math.min((innerWidth-pad)/W, (innerHeight-pad)/H));
  const dispW = Math.round(W*scale), dispH = Math.round(H*scale);
  const stage = document.getElementById("stage");
  stage.style.width = cv.style.width = dispW+"px";
  stage.style.height = cv.style.height = dispH+"px";
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const bw = Math.min(dispW*dpr, 1920);        // supersampled backbuffer width (cap for perf)
  SUP = Math.max(1, bw / W);
  cv.width  = Math.round(W*SUP);
  cv.height = Math.round(H*SUP);
}
addEventListener("resize", resize); resize();

const clamp = (v,a,b) => v<a?a:(v>b?b:v);

// ---- Audio (WebAudio synth) --------------------------------------------------
let audio=null, muted=false, audioTried=false;
function initAudio() {
  if (audio || muted || audioTried) { if (audio && audio.ctxA.state==="suspended") audio.ctxA.resume(); return; }
  audioTried = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctxA = new AC();
    const master = ctxA.createGain(); master.gain.value=0.85; master.connect(ctxA.destination);
    const o1=ctxA.createOscillator(); o1.type="sawtooth";
    const o2=ctxA.createOscillator(); o2.type="square";
    const eg=ctxA.createGain(); eg.gain.value=0.02;
    const lp=ctxA.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700;
    o1.connect(eg); o2.connect(eg); eg.connect(lp); lp.connect(master); o1.start(); o2.start();
    const buf=ctxA.createBuffer(1, ctxA.sampleRate*2, ctxA.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const noise=ctxA.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const nf=ctxA.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=1000; nf.Q.value=0.6;
    const ng=ctxA.createGain(); ng.gain.value=0;
    noise.connect(nf); nf.connect(ng); ng.connect(master); noise.start();
    // siren
    const so=ctxA.createOscillator(); so.type="square";
    const sg=ctxA.createGain(); sg.gain.value=0; so.connect(sg); sg.connect(master); so.start();
    audio={ ctxA, master, o1, o2, eg, lp, nf, ng, so, sg };
    if (ctxA.state==="suspended") ctxA.resume();
  } catch(e){ audio=null; }
}
function updateAudio() {
  if (!audio) return;
  try {
    const a=audio, now=a.ctxA.currentTime;
    const sp=Math.min(1.2, player.speed/MAX_SPEED);
    const playing = state==="play" && !paused;
    const rpm = playing ? (0.12+sp*0.9) : 0.18;
    const base = 52 + rpm*130 + (player.boosting?36:0);
    a.o1.frequency.setTargetAtTime(base, now, 0.05);
    a.o2.frequency.setTargetAtTime(base*1.5, now, 0.05);
    a.lp.frequency.setTargetAtTime(480 + sp*2500 + (player.boosting?1600:0), now, 0.06);
    a.eg.gain.setTargetAtTime(playing ? (0.05+sp*0.09) : 0.015, now, 0.08);
    a.ng.gain.setTargetAtTime(player.boosting ? 0.16 : sp*0.035, now, 0.1);
    a.nf.frequency.setTargetAtTime(player.boosting ? 2600 : 900+sp*1100, now, 0.1);
    // siren while chased
    const sirenOn = playing && chasing;
    a.so.frequency.setTargetAtTime(Math.floor(clock*2.2)%2===0 ? 720 : 940, now, 0.02);
    a.sg.gain.setTargetAtTime(sirenOn ? 0.05 : 0, now, 0.08);
  } catch(e){}
}
function beep(f0,f1,dur,vol,type){
  if (!audio) return;
  try {
    const a=audio, t=a.ctxA.currentTime;
    const o=a.ctxA.createOscillator(); o.type=type||"triangle";
    const g=a.ctxA.createGain(); g.gain.value=0;
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(a.master); o.start(t); o.stop(t+dur+0.02);
  } catch(e){}
}
function sfxPass(){ beep(680,1360,0.22,0.22); }
function sfxDrift(){ beep(300,180,0.14,0.05,"sawtooth"); }
function sfxCrash(){
  if (!audio) return;
  try {
    const a=audio, t=a.ctxA.currentTime;
    const buf=a.ctxA.createBuffer(1, a.ctxA.sampleRate*0.3, a.ctxA.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=a.ctxA.createBufferSource(); s.buffer=buf;
    const f=a.ctxA.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1400;
    const g=a.ctxA.createGain(); g.gain.value=0.5;
    s.connect(f); f.connect(g); g.connect(a.master); s.start(t);
  } catch(e){}
}

let state="menu";   // menu | garage | play | dayclear | gameover | busted

// ---- Track building ----------------------------------------------------------
function lastY(){ return segments.length===0 ? 0 : segments[segments.length-1].p2.world.y; }
function addSegment(curve, y) {
  const n=segments.length;
  segments.push({
    index:n,
    p1:{ world:{ y:lastY(), z:n*SEG_LEN }, cam:{}, screen:{} },
    p2:{ world:{ y:y, z:(n+1)*SEG_LEN }, cam:{}, screen:{} },
    curve, color: Math.floor(n/RUMBLE_LEN)%2,
  });
}
function addRoad(enter,hold,leave,curve,y) {
  const startY=lastY(), endY=startY+y*SEG_LEN, total=enter+hold+leave;
  for(let i=0;i<enter;i++) addSegment(easeIn(0,curve,i/enter), easeInOut(startY,endY,i/total));
  for(let i=0;i<hold;i++)  addSegment(curve, easeInOut(startY,endY,(enter+i)/total));
  for(let i=0;i<leave;i++) addSegment(easeInOut(curve,0,i/leave), easeInOut(startY,endY,(enter+hold+i)/total));
}
function easeIn(a,b,p){ return a+(b-a)*Math.pow(p,2); }
function easeInOut(a,b,p){ return a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5); }

let rngSeed=1;
function rnd(){ rngSeed=(rngSeed*9301+49297)%233280; return rngSeed/233280; }

// minimap geometry bounds
let mapMinX=0, mapMaxX=0, mapMinY=0, mapMaxY=0;

function buildTrack(seed) {
  segments=[]; rngSeed=seed;
  addRoad(30,30,30,0,0);
  const pieces=22+day*2;
  for(let i=0;i<pieces;i++){
    const len=[25,50,100][Math.floor(rnd()*3)];
    const curve=(rnd()<0.5?-1:1)*[0,2,4,6][Math.floor(rnd()*4)];
    const hill=(rnd()<0.5?-1:1)*[0,20,40,60][Math.floor(rnd()*4)];
    addRoad(len*0.4|0, len, len*0.4|0, curve, hill);
  }
  addRoad(30,30,30,0,0);
  addScenery();
  buildMap();
  trackLength=segments.length*SEG_LEN;
}
// integrate curvature into a 2D path for the minimap
function buildMap() {
  let hd=0, hx=0, hy=0;
  mapMinX=mapMinY=1e9; mapMaxX=mapMaxY=-1e9;
  for (const s of segments) {
    hd += s.curve*0.018;
    hx += Math.sin(hd); hy += Math.cos(hd);
    s.mx=hx; s.my=hy;
    if (hx<mapMinX) mapMinX=hx; if (hx>mapMaxX) mapMaxX=hx;
    if (hy<mapMinY) mapMinY=hy; if (hy>mapMaxY) mapMaxY=hy;
  }
}
const NEON_TXT=["NITRO","TURBO","2026","N2O","SPEED","CLUB","DRIFT","NEON","MAX","GO"];
const NEON_COL=["#ff2d95","#00eaff","#ffd23f","#7cff4f","#b14aff","#ff6a2a","#39ff14"];
function addScenery() {
  for(let i=0;i<segments.length;i++){
    const s=segments[i]; s.sprites=[];
    // dense city buildings hugging both sides — an urban canyon
    if (i%4===0) s.sprites.push({type:"building", offset:-(1.32+rnd()*0.85), h:1.3+rnd()*2.6, c:Math.floor(rnd()*5), win:Math.floor(rnd()*3)});
    if (i%4===2) s.sprites.push({type:"building", offset:(1.32+rnd()*0.85), h:1.3+rnd()*2.6, c:Math.floor(rnd()*5), win:Math.floor(rnd()*3)});
    // a taller back row for skyline depth
    if (rnd()<0.5) s.sprites.push({type:"building", offset:(rnd()<0.5?-1:1)*(2.5+rnd()*1.7), h:1.8+rnd()*2.8, c:Math.floor(rnd()*5), win:Math.floor(rnd()*3)});
    // street lights
    if (i%9===0) s.sprites.push({type:"pole", offset:1.28});
    if (i%9===4) s.sprites.push({type:"pole", offset:-1.28});
    // glowing neon signs on the near buildings
    if (i%11===6) s.sprites.push({type:"neon", offset:(rnd()<0.5?-1:1)*(1.28+rnd()*0.35), text:NEON_TXT[Math.floor(rnd()*NEON_TXT.length)], col:NEON_COL[Math.floor(rnd()*NEON_COL.length)], vy:0.6+rnd()*1.4});
    // occasional big branded billboard
    if (i%40===18) s.sprites.push({type:"billboard", offset:(rnd()<0.5?-1:1)*1.5, text:"ENDURO"});
    // sparse trees for variation
    if (rnd()<0.05) s.sprites.push({type:"tree", offset:(rnd()<0.5?-1:1)*(2.4+rnd()*1.4)});
  }
}
function findSegment(z) {
  let i=Math.floor(z/SEG_LEN)%segments.length; if (i<0) i+=segments.length; return segments[i];
}
function loopedRel(z) {
  let rel=z-player.z;
  if (rel>trackLength/2) rel-=trackLength;
  if (rel<-trackLength/2) rel+=trackLength;
  return rel;
}

const CAR_COLORS=["#e03a3a","#3a7ae0","#f2c14e","#8a4ae0","#2ec4a6","#e07a2a","#d0d0e0"];
function resetCars() {
  cars=[];
  const count=14+day*3;
  for(let i=0;i<count;i++){
    const seg=Math.floor(rnd()*segments.length);
    cars.push({
      offset:(rnd()*2-1)*0.7, z:seg*SEG_LEN+rnd()*SEG_LEN,
      speed:MAX_SPEED*(0.28+rnd()*0.30),
      tint:Math.floor(rnd()*CAR_TINTS.length),
      color:CAR_COLORS[Math.floor(rnd()*CAR_COLORS.length)],
      passed:false, w:0.9+rnd()*0.25,
    });
  }
  cars.sort((a,b)=>a.z-b.z);
}

// ---- Particles ---------------------------------------------------------------
function spawnSparks(sx,sy,n,col) {
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI-Math.PI, spd=40+Math.random()*140;
    sparks.push({ x:sx+(Math.random()-0.5)*20, y:sy+(Math.random()-0.5)*8,
      vx:Math.cos(ang)*spd, vy:-Math.abs(Math.sin(ang))*spd-20,
      life:0.4+Math.random()*0.4, max:0.8,
      col: col || (Math.random()<0.5?"#ffd24a":"#ff8a3a"), sz:Math.random()<0.5?2:1 });
  }
  if (sparks.length>180) sparks.splice(0,sparks.length-180);
}
function spawnSmoke(sx,sy) {
  smoke.push({ x:sx+(Math.random()-0.5)*10, y:sy+(Math.random()-0.5)*4,
    vx:(Math.random()-0.5)*20, vy:-6-Math.random()*10,
    life:0.5+Math.random()*0.4, max:0.9, r:3+Math.random()*4 });
  if (smoke.length>90) smoke.splice(0,smoke.length-90);
}
function updateParticles(dt) {
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=320*dt; s.life-=dt; if(s.life<=0) sparks.splice(i,1); }
  for(let i=smoke.length-1;i>=0;i--){ const s=smoke[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.r+=14*dt; s.life-=dt; if(s.life<=0) smoke.splice(i,1); }
}

// ---- Police ------------------------------------------------------------------
function startChase() {
  chasing=true; wanted=1; chaseTime=0; escapeTimer=0;
  const n=1+Math.min(2, Math.floor(day/2));
  police=[];
  for(let i=0;i<n;i++) police.push({ z:player.z-SEG_LEN*(9+i*5), offset:player.x, speed:player.speed*0.85 });
  flash("POLÍCIA!", "#ff5a4a");
  beep(500,900,0.3,0.08,"sawtooth");
}
function endChase(escaped) {
  chasing=false; police=[]; heat=0; wanted=0; bustMeter=0; chaseTime=0; escapeTimer=0;
  if (escaped) { flash("ESCAPOU!", "#7fffb0"); beep(700,1200,0.3,0.09); }
}
function updatePolice(dt) {
  if (!chasing) return;
  chaseTime+=dt;
  wanted=Math.min(5, 1+Math.floor(chaseTime/12));
  let nearestGap=Infinity, cornered=false;
  for (const cop of police) {
    const desired=Math.min(MAX_SPEED*(1.02+wanted*0.02), Math.max(player.speed*1.03, MAX_SPEED*0.6));
    cop.speed += (desired-cop.speed)*Math.min(1,dt*1.4);
    cop.z += cop.speed*dt; if (cop.z>=trackLength) cop.z-=trackLength; if (cop.z<0) cop.z+=trackLength;
    cop.offset += (player.x-cop.offset)*Math.min(1,dt*1.3);
    const rel=loopedRel(cop.z); cop.rel=rel;              // negative = behind
    const gap=-rel;
    if (gap>=0 && gap<nearestGap) nearestGap=gap;
    // cornered: cop right on the player, same lane
    if (rel<0 && rel>-SEG_LEN*2.2 && Math.abs(cop.offset-player.x)<0.75) {
      cornered=true;
      bustMeter=Math.min(1, bustMeter + dt*0.34);
      if (Math.random()<0.35) spawnSparks(W/2, H-40, 3, "#8ad0ff");
      steerShake += (Math.random()-0.5)*0.6;
    }
    // cop ahead blocking (rammed you)
    if (rel>0 && rel<SEG_LEN*1.3 && Math.abs(cop.offset-player.x)<0.8 && player.speed>cop.speed) {
      if (crashTimer<=0){ player.speed=Math.min(player.speed,CRASH_SPEED); crashTimer=0.5; bustMeter=Math.min(1,bustMeter+0.12); spawnSparks(W/2,H-40,14); sfxCrash(); }
    }
  }
  if (!cornered) bustMeter=Math.max(0, bustMeter - dt*0.16);
  if (nearestGap>SEG_LEN*26) { escapeTimer+=dt; if (escapeTimer>4.5) { endChase(true); return; } }
  else escapeTimer=0;
  if (bustMeter>=1) busted();
}

// ---- Update ------------------------------------------------------------------
function update(dt) {
  if (state!=="play" || paused) return;

  const seg=findSegment(player.z);
  const maxSpeed=MAX_SPEED*pcar.top;
  const speedPct=player.speed/MAX_SPEED;
  const grip=pcar.grip;

  // steering (car grip affects responsiveness)
  const steer=(K.left?-1:0)+(K.right?1:0);
  const dx=dt*2*speedPct*grip;
  if (K.left)  { player.x-=dx; steerShake=-1; }
  else if (K.right){ player.x+=dx; steerShake=1; }
  else steerShake*=0.8;
  player.x -= dt*2*speedPct*speedPct*seg.curve*CENTRIFUGAL;

  const offroad=Math.abs(player.x)>1;

  // ---- drift ----
  if (speedPct>0.45 && steer!==0 && !offroad && crashTimer<=0) {
    driftAngle += steer*dt*2.4*speedPct;
  } else {
    driftAngle *= Math.pow(0.015, dt);
  }
  driftAngle=clamp(driftAngle,-0.7,0.7);
  const wasDrifting=drifting;
  drifting = Math.abs(driftAngle)>0.14 && speedPct>0.45 && !offroad && crashTimer<=0;
  if (drifting) {
    player.x += driftAngle*dt*0.9*(2-grip);        // slide outward (less grip = more slide)
    driftScore += Math.abs(driftAngle)*speedPct*dt*820;
    if (Math.random()<0.8){ spawnSmoke(W/2-24,H-30); spawnSmoke(W/2+24,H-30); }
    if (!wasDrifting) sfxDrift();
  } else if (wasDrifting && driftScore>0) {
    driftBank=driftScore; score+=driftScore|0; flash("DRIFT +"+(driftScore|0), "#ffd24a"); driftScore=0;
    beep(500,900,0.18,0.07);
  }

  // ---- nitro / boost ----
  const wantBoost=K.boost && player.nitro>0 && player.speed>MAX_SPEED*0.25 && !offroad;
  player.boosting=wantBoost;
  let topSpeed=maxSpeed;
  if (wantBoost) {
    topSpeed=maxSpeed*NITRO_BOOST;
    player.speed += NITRO_ACCEL*dt;
    player.nitro=Math.max(0, player.nitro-NITRO_DRAIN*dt);
  } else {
    player.nitro=Math.min(1, player.nitro+NITRO_REGEN*dt);
  }

  if (K.gas) player.speed += ACCEL*pcar.accel*dt;
  else if (K.brake) player.speed += BRAKE*dt;
  else if (!wantBoost) player.speed += DECEL*dt;

  if (offroad) {
    if (player.speed>OFFROAD_CAP) player.speed += OFFROAD_DEC*dt;
    steerShake=Math.sin(player.z*0.05);
  }
  player.speed=Math.max(0, Math.min(player.speed, topSpeed));
  player.x=clamp(player.x,-2,2);

  if (comboTimer>0){ comboTimer-=dt; if (comboTimer<=0) combo=0; }
  updateParticles(dt);
  if (crashTimer>0) crashTimer-=dt;

  player.z += player.speed*dt;
  while (player.z>=trackLength) player.z-=trackLength;
  distance += player.speed*dt/SEG_LEN;

  // ---- rival cars: collisions ----
  const playerW=0.9;
  for (const c of cars) {
    c.z += c.speed*dt; if (c.z>=trackLength) c.z-=trackLength;
    const rel=loopedRel(c.z);
    if (Math.abs(rel)<SEG_LEN*1.2 && player.speed>c.speed) {
      if (Math.abs(player.x-c.offset)<(playerW+c.w)*0.5 && crashTimer<=0) {
        player.speed=Math.min(player.speed,CRASH_SPEED); crashTimer=0.6;
        steerShake=(player.x<c.offset?-3:3);
        player.x+=(player.x<c.offset?-0.3:0.3);
        combo=0; comboTimer=0; driftAngle=0; driftScore=0;
        heat=Math.min(1, heat+0.14);              // reckless → heat
        spawnSparks(W/2,H-42,20); sfxCrash();
      }
    }
  }
  // ---- passing detection + position ----
  let ahead=0;
  for (const c of cars) {
    const rel=loopedRel(c.z);
    if (rel>0) ahead++;
    const nowBehind=rel<0;
    if (c._wasAhead===undefined) c._wasAhead=rel>0;
    if (c._wasAhead && nowBehind && rel>-SEG_LEN*6 && !c.passed) {
      c.passed=true; carsPassed++; totalPassed++; score+=100;
      flash("ULTRAPASSOU!", "#7fffb0");
      combo++; comboTimer=3.5;
      player.nitro=Math.min(1, player.nitro+NITRO_PER_PASS);
      sfxPass();
      if (carsPassed>=carsToPass){ dayCleared(); return; }
    }
    if (!nowBehind){ c._wasAhead=true; c.passed=false; } else c._wasAhead=false;
  }
  position=1+ahead;

  // ---- heat / police ----
  let hg=0;
  if (speedPct>0.85) hg+=dt*0.05;
  if (player.boosting) hg+=dt*0.05;
  if (drifting) hg+=dt*0.035;
  heat += hg;
  if (!chasing) heat -= dt*0.03;
  heat=clamp(heat,0,1);
  if (!chasing && heat>=1) startChase();
  updatePolice(dt);

  // phase cycle
  phaseTime+=dt;
  if (phaseTime>=PHASE_DURATION){ phaseTime=0; phaseIdx=(phaseIdx+1)%PHASE_ORDER.length; }

  if (flashTimer>0) flashTimer-=dt;

  if (distance>(segments.length*1.7) && carsPassed<carsToPass) gameOver();
}
function flash(msg,col){ flashMsg=msg; flashCol=col||"#7fffb0"; flashTimer=1.0; }

// ---- Rendering: projection ---------------------------------------------------
function project(p,camX,camY,camZ) {
  p.cam.x=(p.world.x||0)-camX;
  p.cam.y=(p.world.y||0)-camY;
  p.cam.z=(p.world.z||0)-camZ;
  const scale=camDepth/(p.cam.z||0.0001);
  p.screen.scale=scale;
  p.screen.x=Math.round(W/2 + scale*p.cam.x*W/2);
  p.screen.y=Math.round(H/2 - scale*p.cam.y*H/2);
  p.screen.w=Math.round(scale*ROAD_WIDTH*W/2);
}
function rectPoly(x1,y1,w1,x2,y2,w2,color) {
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x1-w1,y1); ctx.lineTo(x1+w1,y1); ctx.lineTo(x2+w2,y2); ctx.lineTo(x2-w2,y2);
  ctx.closePath(); ctx.fill();
}
function shade(hex,amt) {
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(r+amt,0,255); g=clamp(g+amt,0,255); b=clamp(b+amt,0,255);
  return `rgb(${r},${g},${b})`;
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

const CLOUDS=[{x:40,y:30,s:1.1},{x:150,y:52,s:0.8},{x:250,y:26,s:1.3},{x:330,y:60,s:0.9},{x:110,y:74,s:0.7}];
function drawCloud(cx,cy,s){ for(const o of [[0,0,14],[-11,3,10],[11,3,10],[-4,-5,9],[6,-4,9]]){ ctx.beginPath(); ctx.ellipse(cx+o[0]*s,cy+o[1]*s,o[2]*s,o[2]*s*0.7,0,0,Math.PI*2); ctx.fill(); } }
function drawSky(t,horizon) {
  const g=ctx.createLinearGradient(0,0,0,horizon+20);
  g.addColorStop(0,t.sky[0]); g.addColorStop(0.55,t.sky[1]); g.addColorStop(1,t.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(-8,0,W+16,horizon+20);
  const phase=PHASE_ORDER[phaseIdx];
  if (phase==="day"||phase==="dawn"||phase==="dusk"||phase==="snow") {
    ctx.fillStyle= phase==="dusk"?"rgba(255,224,205,0.5)":phase==="dawn"?"rgba(255,236,225,0.55)":phase==="snow"?"rgba(255,255,255,0.7)":"rgba(255,255,255,0.6)";
    for(const cl of CLOUDS){ const span=W+120; const cxp=((cl.x-clock*4)%span+span)%span-60; drawCloud(cxp,cl.y,cl.s); }
  }
  if (phase==="night"||phase==="rain") {
    if (phase==="night"){
      ctx.fillStyle="#f4f4ff"; ctx.beginPath(); ctx.arc(240,42,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=t.sky[1]; ctx.beginPath(); ctx.arc(236,40,11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.8)";
      for(let i=0;i<40;i++){ const sx=(i*73)%W, sy=(i*31)%(horizon-10); if((i*7)%3===0) ctx.fillRect(sx,sy,1,1); }
    } else { // rain clouds
      ctx.fillStyle="rgba(20,26,40,0.6)";
      for(const cl of CLOUDS){ const span=W+120; const cxp=((cl.x-clock*10)%span+span)%span-60; drawCloud(cxp,cl.y*0.7,cl.s*1.2); }
    }
  } else if (phase==="day"||phase==="dawn"||phase==="dusk") {
    const sxp=phase==="dawn"?70:phase==="dusk"?250:160;
    ctx.fillStyle=phase==="day"?"#fff7d0":"#ffd28a"; ctx.beginPath(); ctx.arc(sxp,46,16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.arc(sxp,46,24,0,Math.PI*2); ctx.fill();
  }
}
function drawHills(t,horizon) {
  ctx.fillStyle=shade(t.grassD,-18);
  ctx.beginPath(); ctx.moveTo(0,horizon);
  for(let x=0;x<=W;x+=16){ const y=horizon-8-Math.sin((x*0.03)+day)*6-Math.sin(x*0.11)*3; ctx.lineTo(x,y); }
  ctx.lineTo(W,horizon); ctx.closePath(); ctx.fill();
}

function drawSpeedFX() {
  const sp=player.speed/MAX_SPEED;
  const intensity=Math.max(0,sp-0.55)/0.45;
  const amt=Math.min(1,intensity+(player.boosting?0.6:0));
  if (amt<=0.02) return;
  const cxp=W/2, cyp=H*0.46; ctx.lineWidth=1;
  ctx.strokeStyle=player.boosting?"rgba(150,200,255,"+(0.55*amt).toFixed(3)+")":"rgba(255,255,255,"+(0.35*amt).toFixed(3)+")";
  const n=16+(amt*22|0);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+(i%2?clock*1.5:-clock*1.5);
    const r0=26+((clock*520+i*61)%(W*0.55)), r1=r0+26+amt*46;
    const dcx=Math.cos(ang), dcy=Math.sin(ang)*0.72;
    ctx.beginPath(); ctx.moveTo(cxp+dcx*r0,cyp+dcy*r0); ctx.lineTo(cxp+dcx*r1,cyp+dcy*r1); ctx.stroke();
  }
  if (player.boosting) {
    const g=ctx.createRadialGradient(W/2,H*0.5,H*0.18,W/2,H*0.5,W*0.62);
    g.addColorStop(0,"rgba(40,90,255,0)"); g.addColorStop(1,"rgba(40,90,255,0.26)");
    ctx.fillStyle=g; ctx.fillRect(-8,-8,W+16,H+16);
  }
}
function drawSparks() {
  for(const s of sparks){ ctx.globalAlpha=clamp(s.life/s.max,0,1); ctx.fillStyle=s.col; ctx.fillRect(s.x|0,s.y|0,s.sz+1,s.sz+1); }
  ctx.globalAlpha=1;
}
function drawSmoke() {
  for(const s of smoke){ ctx.globalAlpha=clamp(s.life/s.max,0,1)*0.5; ctx.fillStyle="#dfe6f2"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}

function drawSprite(sp,seg,t,fog) {
  const p=seg.p1.screen, unit=p.w*0.9;
  if (p.scale<=0||unit<0.6) return;
  const gx=p.x+p.w*sp.offset, gy=p.y, clipY=seg._clip;
  if (clipY<1||gx<-80||gx>W+80) return;
  const night=PHASE_ORDER[phaseIdx]==="night"||wet;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,clipY); ctx.clip();
  let bx=gx,by=gy,bw2=unit,bh=unit;
  if (sp.type==="tree") {
    const th=unit*2.6, tw=unit*0.9;
    ctx.fillStyle="#5b3a22"; ctx.fillRect(gx-tw*0.16,gy-th*0.45,tw*0.32,th*0.45);
    const cg=ctx.createLinearGradient(0,gy-th,0,gy-th*0.3);
    cg.addColorStop(0,night?"#1c3a26":"#57a85c"); cg.addColorStop(1,night?"#112a1a":"#2f6f38");
    ctx.fillStyle=cg;
    for(const o of [[0,-th*0.78,tw*1.1],[-tw*0.6,-th*0.55,tw*0.82],[tw*0.6,-th*0.55,tw*0.82],[0,-th*0.45,tw*0.98]]){ ctx.beginPath(); ctx.ellipse(gx+o[0],gy+o[1],o[2],o[2]*1.05,0,0,Math.PI*2); ctx.fill(); }
    by=gy-th; bw2=tw*1.5; bh=th;
  } else if (sp.type==="bush") {
    const r=unit*0.7; ctx.fillStyle=night?"#16301f":"#43873f";
    ctx.beginPath(); ctx.ellipse(gx,gy-r*0.6,r,r*0.7,0,0,Math.PI*2); ctx.fill();
    by=gy-r; bw2=r*1.2; bh=r*1.3;
  } else if (sp.type==="pole") {
    const ph=unit*2.8, dir=sp.offset<0?1:-1;
    ctx.fillStyle="#6a6f7a"; ctx.fillRect(gx-unit*0.06,gy-ph,unit*0.12,ph);
    ctx.fillRect(gx,gy-ph,dir*unit*0.5,unit*0.09);
    const lx=gx+dir*unit*0.5, ly=gy-ph+unit*0.12;
    const lit=night;
    ctx.fillStyle=lit?"#fff3b0":"#3a3f48"; ctx.beginPath(); ctx.ellipse(lx,ly,unit*0.18,unit*0.1,0,0,Math.PI*2); ctx.fill();
    if (lit){
      const gg=ctx.createRadialGradient(lx,ly,0,lx,ly,unit*1.3);
      gg.addColorStop(0,"rgba(255,240,170,0.5)"); gg.addColorStop(1,"rgba(255,240,170,0)");
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(lx,ly,unit*1.3,0,Math.PI*2); ctx.fill();
      // wet reflection streak down onto the road
      if (wet){
        const rg=ctx.createLinearGradient(0,gy,0,gy+unit*1.6);
        rg.addColorStop(0,"rgba(255,240,170,0.32)"); rg.addColorStop(1,"rgba(255,240,170,0)");
        ctx.fillStyle=rg; ctx.fillRect(lx-unit*0.14,gy,unit*0.28,unit*1.6);
      }
    }
    by=gy-ph; bw2=unit*0.8; bh=ph;
  } else if (sp.type==="billboard") {
    const bwid=unit*2.2, bhei=unit*1.2, postH=unit*1.4;
    ctx.fillStyle="#4a4f5a"; ctx.fillRect(gx-unit*0.1,gy-postH,unit*0.2,postH);
    const px0=gx-bwid/2, py0=gy-postH-bhei;
    ctx.fillStyle="#12151d"; ctx.fillRect(px0-2,py0-2,bwid+4,bhei+4);
    const pg=ctx.createLinearGradient(px0,py0,px0,py0+bhei); pg.addColorStop(0,"#ff3a4a"); pg.addColorStop(1,"#8a1020");
    ctx.fillStyle=pg; ctx.fillRect(px0,py0,bwid,bhei);
    if (unit>3 && sp.text){ ctx.fillStyle="#fff"; ctx.font=`800 ${Math.max(6,unit*0.7)|0}px Arial`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(sp.text,gx,py0+bhei/2); }
    by=py0; bw2=bwid*0.6; bh=postH+bhei;
  } else if (sp.type==="building") {
    const bh2=unit*4.2*(sp.h||1), bwid=unit*2.0, bx0=gx-bwid/2;
    const cols = night ? ["#141a2a","#1a1626","#101826","#161320","#0e1a20"]
                       : ["#5a6478","#6a6076","#746a5a","#5a6a72","#66787e"];
    const base=cols[sp.c||0];
    const fgd=ctx.createLinearGradient(0,gy-bh2,0,gy);
    fgd.addColorStop(0, base); fgd.addColorStop(1, shade(base, night?-6:-26));
    ctx.fillStyle=fgd; ctx.fillRect(bx0, gy-bh2, bwid, bh2);
    ctx.fillStyle= night?"rgba(90,120,200,0.14)":"rgba(255,255,255,0.12)";
    ctx.fillRect(bx0, gy-bh2, Math.max(1,bwid*0.06), bh2);
    if (unit>1.6) {
      const wr=Math.max(1,unit*0.16), gapx=wr*2.0, gapy=wr*2.4;
      const warm=["#ffd98a","#ffe6b0","#9fd0ff","#ffbf6a","#bfe0ff"];
      let row=0;
      for(let yy=gy-bh2+gapy; yy<gy-gapy; yy+=gapy){
        let col=0;
        for(let xx=bx0+gapx; xx<gx+bwid/2-wr; xx+=gapx){
          if (night){ const on=(((xx*13+yy*7+(sp.win||0)*97)|0)%5)!==0; ctx.fillStyle= on ? warm[((row+col+(sp.win||0))|0)%warm.length] : "rgba(18,24,38,0.9)"; }
          else ctx.fillStyle="rgba(180,205,235,0.55)";
          ctx.fillRect(xx,yy,wr,wr*1.3); col++;
        }
        row++;
      }
    }
    if (night && unit>1.2){ const bl=Math.floor(clock*2+gx)%2===0; ctx.fillStyle=bl?"rgba(255,60,60,0.95)":"rgba(120,20,20,0.6)"; ctx.fillRect(gx-Math.max(1,unit*0.08), gy-bh2-Math.max(1,unit*0.22), Math.max(1,unit*0.16), Math.max(1,unit*0.22)); }
    if (night){ ctx.globalAlpha=0.10; ctx.fillStyle="#6a8cff"; ctx.fillRect(bx0-2, gy-bh2-2, bwid+4, bh2+4); ctx.globalAlpha=1; }
    by=gy-bh2; bw2=bwid*0.6; bh=bh2;
  } else if (sp.type==="neon") {
    const nw=unit*1.9, nh=unit*0.7, postH=unit*(1.2+(sp.vy||1));
    const nx=gx, ny=gy-postH, col=sp.col||"#ff2d95";
    ctx.fillStyle="#2a2f3a"; ctx.fillRect(gx-unit*0.05, gy-postH, unit*0.1, postH);
    if (night){ const gl=ctx.createRadialGradient(nx,ny,0,nx,ny,nw*0.95); gl.addColorStop(0,hexA(col,0.6)); gl.addColorStop(1,hexA(col,0)); ctx.fillStyle=gl; ctx.beginPath(); ctx.ellipse(nx,ny,nw*0.95,nh*1.7,0,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle="#0c0f16"; ctx.fillRect(nx-nw/2,ny-nh/2,nw,nh);
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,unit*0.09); ctx.strokeRect(nx-nw/2+1,ny-nh/2+1,nw-2,nh-2);
    if (unit>2.2 && sp.text){ ctx.fillStyle=night?"#ffffff":col; ctx.font=`800 ${Math.max(6,nh*0.72)|0}px Arial`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.shadowColor=col; ctx.shadowBlur=night?unit*1.2:0; ctx.fillText(sp.text,nx,ny); ctx.shadowBlur=0; }
    if (wet){ const rg=ctx.createLinearGradient(0,gy,0,gy+unit*2.2); rg.addColorStop(0,hexA(col,0.4)); rg.addColorStop(1,hexA(col,0)); ctx.fillStyle=rg; ctx.fillRect(nx-nw*0.4, gy, nw*0.8, unit*2.2); }
    by=ny-nh; bw2=nw*0.7; bh=postH+nh;
  }
  if (fog>0.02){ ctx.globalAlpha=Math.min(0.9,fog); ctx.fillStyle=t.fog; ctx.fillRect(bx-bw2,by,bw2*2,bh+2); ctx.globalAlpha=1; }
  ctx.restore();
}

let frameCounter=0;
function render() {
  frameCounter++;
  ctx.setTransform(SUP,0,0,SUP,0,0);   // supersample: draw the logical scene into the hi-res backbuffer
  const t=curTheme();
  wet = !!t.wet || PHASE_ORDER[phaseIdx]==="night";   // wet-look asphalt at night too (Underground vibe)
  const baseSeg=findSegment(player.z);
  const basePercent=(player.z%SEG_LEN)/SEG_LEN;
  const playerY=baseSeg.p1.world.y+(baseSeg.p2.world.y-baseSeg.p1.world.y)*basePercent;
  const camX=player.x*ROAD_WIDTH, camY=CAM_HEIGHT+playerY, camZ=player.z;

  ctx.clearRect(0,0,W,H);
  const horizon=Math.floor(H*0.42);

  let sh=0;
  if (state==="play" && !paused) {
    const sp=player.speed/MAX_SPEED;
    sh=(sp>0.8?(sp-0.8)*8:0)+(player.boosting?1.4:0)+(crashTimer>0?3.5:0)+(chasing?0.6:0);
    sh=Math.min(sh,3.5);
  }
  const shx=sh?Math.sin(clock*97)*sh:0, shy=sh?Math.cos(clock*83)*sh*0.5:0;
  ctx.save(); ctx.translate(shx,shy);

  drawSky(t,horizon);
  drawHills(t,horizon);
  ctx.fillStyle=t.grassD; ctx.fillRect(-8,horizon,W+16,H-horizon+8);

  let x=0, dx=-(baseSeg.curve*basePercent), maxY=H;
  for(let n=0;n<DRAW_DIST;n++){
    const seg=segments[(baseSeg.index+n)%segments.length];
    const looped=seg.index<baseSeg.index;
    const camZseg=camZ-(looped?trackLength:0);
    project(seg.p1, camX-x, camY, camZseg);
    project(seg.p2, camX-x-dx, camY, camZseg);
    x+=dx; dx+=seg.curve;
    if (seg.p1.cam.z<=CAM_DEPTH || seg.p2.screen.y>=maxY) continue;
    if (seg.p2.screen.y>=seg.p1.screen.y) continue;
    seg._clip=maxY; seg._df=frameCounter;
    const p1=seg.p1.screen, p2=seg.p2.screen;
    const dark=seg.color===0;
    const grass=dark?t.grassD:t.grassL, rumble=dark?t.rumbleD:t.rumbleL, road=dark?t.roadD:t.roadL;
    ctx.fillStyle=grass; ctx.fillRect(-8,p2.y,W+16,p1.y-p2.y+1);
    rectPoly(p1.x,p1.y,p1.w*1.15,p2.x,p2.y,p2.w*1.15,rumble);
    rectPoly(p1.x,p1.y,p1.w,p2.x,p2.y,p2.w,road);
    if (!dark) {
      const lw1=p1.w*0.04, lw2=p2.w*0.04;
      for(let l=1;l<LANES;l++){
        const lx1=p1.x-p1.w+(2*p1.w)*(l/LANES), lx2=p2.x-p2.w+(2*p2.w)*(l/LANES);
        rectPoly(lx1,p1.y,lw1,lx2,p2.y,lw2,t.lane);
      }
    }
    // wet sheen: glossy centre reflection on near road
    if (wet && n<70) {
      const a=(1-n/70)*0.16;
      ctx.globalAlpha=a; ctx.fillStyle="#9fb6dc";
      rectPoly(p1.x,p1.y,p1.w*0.5,p2.x,p2.y,p2.w*0.5,"#9fb6dc");
      ctx.globalAlpha=1;
    }
    const fog=Math.pow(n/DRAW_DIST,1.7);
    if (fog>0.015){ ctx.globalAlpha=Math.min(0.92,fog); ctx.fillStyle=t.fog; ctx.fillRect(-8,p2.y,W+16,(p1.y-p2.y)+1); ctx.globalAlpha=1; }
    maxY=p2.y;
  }

  // scenery (back-to-front)
  for(let n=DRAW_DIST-1;n>=0;n--){
    const seg=segments[(baseSeg.index+n)%segments.length];
    if (seg._df!==frameCounter || !seg.sprites || !seg.sprites.length) continue;
    const fogAmt=Math.pow(n/DRAW_DIST,1.6);
    for(const sp of seg.sprites) drawSprite(sp,seg,t,fogAmt);
  }

  // ---- rival + police cars (far to near) ----
  const near=[];
  for(const c of cars){ const rel=loopedRel(c.z); if (rel>0 && rel<DRAW_DIST*SEG_LEN) near.push({c,rel,pol:false}); }
  for(const c of police){ const rel=loopedRel(c.z); if (rel>0 && rel<DRAW_DIST*SEG_LEN) near.push({c,rel,pol:true}); }
  near.sort((a,b)=>b.rel-a.rel);
  for(const it of near){
    const c=it.c;
    const segIdx=Math.floor(c.z/SEG_LEN)%segments.length, seg=segments[segIdx];
    let cz=c.z; if (cz<player.z) cz+=trackLength;
    const p={ world:{x:c.offset*ROAD_WIDTH, y:seg.p1.world.y, z:cz}, cam:{}, screen:{} };
    project(p,camX,camY,camZ);
    if (p.screen.scale<=0) continue;
    const fog=Math.pow(it.rel/(DRAW_DIST*SEG_LEN),1.6);
    drawCar(p.screen.x,p.screen.y,p.screen.scale,it.pol?0:(c.tint||0),Math.min(0.9,fog),t.fog,it.pol?{police:true}:null);
  }

  drawWeather(t,horizon);
  drawSpeedFX();
  drawSmoke();
  if (state!=="menu" && state!=="garage") drawPlayer();
  drawSparks();

  ctx.restore();

  if (state==="play") drawHUD(t);

  if (state==="menu") drawMenu();
  else if (state==="garage") drawGarage();
  else if (state==="dayclear") drawDayClear();
  else if (state==="gameover") drawGameOver();
  else if (state==="busted") drawBusted();
  else if (paused) drawPaused();
}

// ---- Car sprites -------------------------------------------------------------
// Realistic rear-view car. Trapezoidal body (wider at the base), tyres, glossy
// paint with a specular shoulder, reflective rear glass, glowing tail-lights,
// number plate and twin exhausts. `opts.police` adds livery + roof lightbar.
function drawCar(sx,sy,scale,tint,fog,fogColor,opts) {
  const police=opts&&opts.police;
  if (spriteReady) {
    const sw=Math.max(7, scale*ROAD_WIDTH*W/2*0.46);
    if (sw<3) return;
    const sh=sw*spriteH/spriteW;
    ctx.fillStyle="rgba(0,0,0,0.30)";
    ctx.beginPath(); ctx.ellipse(sx, sy, sw*0.46, Math.max(2,sh*0.16), 0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1 - Math.min(0.82, fog||0);   // fade into distance haze
    ctx.drawImage(carImg(tint, police), sx-sw/2, sy-sh*0.9, sw, sh);
    ctx.globalAlpha = 1;
    if (police && sw>12) {                            // flashing roof lightbar
      const on=Math.floor(clock*8)%2===0, by=sy-sh*0.9-Math.max(2,sh*0.1);
      ctx.fillStyle=on?"#ff2a2a":"#2a6bff"; ctx.fillRect(sx-sw*0.17, by, sw*0.15, Math.max(1,sh*0.09));
      ctx.fillStyle=on?"#2a6bff":"#ff2a2a"; ctx.fillRect(sx+sw*0.02, by, sw*0.15, Math.max(1,sh*0.09));
      ctx.globalAlpha=0.5; ctx.fillStyle=on?"rgba(255,40,40,1)":"rgba(40,110,255,1)"; ctx.fillRect(sx-sw*0.17, by-2, sw*0.34, 2); ctx.globalAlpha=1;
    }
    return;
  }
  // ---- vector fallback (until the sprite image finishes decoding) ----
  const color = CAR_TINTS[tint] ? CAR_TINTS[tint].hex : "#cccccc";
  const w=Math.max(7, scale*ROAD_WIDTH*W/2*0.32);
  if (w<3) return;
  const h=w*0.70, x=sx-w/2, y=sy-h;
  const body=police?"#eef1f6":color;
  const detail=w>13;                       // draw fine details only when big enough

  // ground contact shadow
  ctx.fillStyle="rgba(0,0,0,0.34)";
  ctx.beginPath(); ctx.ellipse(sx, sy+h*0.02, w*0.60, Math.max(2,h*0.14), 0,0,Math.PI*2); ctx.fill();

  // rear tyres (wide, low)
  const tw=w*0.19, th=h*0.34;
  ctx.fillStyle="#0b0b0e";
  ctx.fillRect(x-tw*0.15, y+h-th, tw, th);
  ctx.fillRect(x+w-tw*0.85, y+h-th, tw, th);
  if (detail){ ctx.fillStyle="#2a2c33"; ctx.fillRect(x-tw*0.15, y+h-th*0.7, tw, th*0.3); ctx.fillRect(x+w-tw*0.85, y+h-th*0.7, tw, th*0.3); }

  // body — trapezoid, narrower at the roof
  const topIn=w*0.11;
  ctx.beginPath();
  ctx.moveTo(x+topIn, y); ctx.lineTo(x+w-topIn, y);
  ctx.lineTo(x+w, y+h); ctx.lineTo(x, y+h); ctx.closePath();
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0, shade(body,72)); g.addColorStop(0.26, shade(body,28));
  g.addColorStop(0.62, body); g.addColorStop(1, shade(body,-62));
  ctx.fillStyle=g; ctx.fill();
  // specular shoulder highlight
  ctx.fillStyle="rgba(255,255,255,0.20)"; ctx.fillRect(x+topIn, y+h*0.05, w-2*topIn, Math.max(1,h*0.05));

  // police livery band
  if (police) { ctx.fillStyle="#14161d"; ctx.fillRect(x, y+h*0.5, w, h*0.16); }

  // rear window with sky reflection
  const winW=w*0.62, winX=sx-winW/2, winY=y+h*0.13, winH=h*0.28;
  ctx.fillStyle="#0c0f16"; ctx.fillRect(winX, winY, winW, winH);
  const wg=ctx.createLinearGradient(0,winY,0,winY+winH);
  wg.addColorStop(0,"rgba(160,200,240,0.75)"); wg.addColorStop(0.5,"rgba(70,100,140,0.5)"); wg.addColorStop(1,"rgba(24,36,58,0.6)");
  ctx.fillStyle=wg; ctx.fillRect(winX+1, winY+1, winW-2, winH-2);

  // tail-light recess + glowing lamps
  const tlY=y+h*0.58, tlH=h*0.19;
  ctx.fillStyle=shade(body,-72); ctx.fillRect(x, tlY-1, w, tlH+2);
  function lamp(lx,lw){
    const rg=ctx.createLinearGradient(0,tlY,0,tlY+tlH);
    rg.addColorStop(0,"#ff9a7a"); rg.addColorStop(0.5,"#ff2a18"); rg.addColorStop(1,"#8c0000");
    ctx.fillStyle=rg; ctx.fillRect(lx,tlY,lw,tlH);
    if (detail){ ctx.globalAlpha=0.55; ctx.fillStyle="rgba(255,70,50,1)"; ctx.fillRect(lx,tlY+tlH*0.25,lw,tlH*0.45); ctx.globalAlpha=1; }
  }
  lamp(x+w*0.06, w*0.30); lamp(x+w*0.64, w*0.30);
  if (detail){ // connecting light strip
    ctx.fillStyle="rgba(180,20,20,0.7)"; ctx.fillRect(x+w*0.36, tlY+tlH*0.35, w*0.28, Math.max(1,tlH*0.3));
  }

  // number plate
  if (detail){ ctx.fillStyle="#e6ebf3"; ctx.fillRect(sx-w*0.11, y+h-th*0.55, w*0.22, Math.max(1,h*0.11));
    ctx.fillStyle="#5a6474"; ctx.fillRect(sx-w*0.08, y+h-th*0.5, w*0.16, Math.max(1,h*0.04)); }
  // twin exhaust tips
  if (w>17){ ctx.fillStyle="#1d1f26"; ctx.fillRect(x+w*0.26, y+h-2, w*0.09, 2); ctx.fillRect(x+w*0.65, y+h-2, w*0.09, 2); }

  // police roof lightbar
  if (police && w>10) {
    const on=Math.floor(clock*8)%2===0;
    ctx.fillStyle=on?"#ff2a2a":"#2a6bff"; ctx.fillRect(x+w*0.30,y-3,w*0.18,3);
    ctx.fillStyle=on?"#2a6bff":"#ff2a2a"; ctx.fillRect(x+w*0.52,y-3,w*0.18,3);
    ctx.globalAlpha=0.5; ctx.fillStyle=on?"rgba(255,40,40,1)":"rgba(40,110,255,1)"; ctx.fillRect(x+w*0.30,y-6,w*0.40,3); ctx.globalAlpha=1;
  }

  // distance fog blend over the whole silhouette
  if (fog && fog>0.02) {
    ctx.globalAlpha=fog; ctx.fillStyle=fogColor||"#fff";
    ctx.beginPath(); ctx.moveTo(x+topIn,y); ctx.lineTo(x+w-topIn,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawPlayer() {
  const bob=state==="play"?Math.sin(player.z*0.05)*(player.speed/MAX_SPEED):0;
  const shake=(crashTimer>0?(Math.random()-0.5)*4:0)+steerShake*1.4;
  const cx=W/2+shake+driftAngle*26, cy=H-22+bob;
  if (spriteReady) {
    const w=Math.round(W*0.32), h=w*spriteH/spriteW, x=cx-w/2, y=cy-h;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(driftAngle*0.22); ctx.translate(-cx,-cy);
    ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(cx, cy-3, w*0.46, 6, 0,0,Math.PI*2); ctx.fill();
    if (player.boosting && state==="play") {
      for(const fx of [cx-w*0.15, cx+w*0.15]){
        const fl=12+Math.abs(Math.sin(clock*38+fx))*16;
        const fg=ctx.createLinearGradient(0,cy-5,0,cy-5+fl);
        fg.addColorStop(0,"rgba(255,255,255,0.95)"); fg.addColorStop(0.35,"rgba(130,190,255,0.9)"); fg.addColorStop(1,"rgba(40,80,255,0)");
        ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(fx-5,cy-5); ctx.lineTo(fx+5,cy-5); ctx.lineTo(fx,cy-5+fl); ctx.closePath(); ctx.fill();
      }
    }
    ctx.drawImage(tintCanvas[pTint]||tintCanvas[0], x, y, w, h);
    if (K.brake && state==="play"){ ctx.globalAlpha=0.45; ctx.fillStyle="rgba(255,40,30,1)"; ctx.fillRect(x+w*0.17, y+h*0.42, w*0.66, Math.max(1,h*0.12)); ctx.globalAlpha=1; }
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(driftAngle*0.26); ctx.translate(-cx,-cy);
  const w=72, h=42, x=cx-w/2, y=cy-h*0.62;

  // ground shadow
  ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(cx, y+h*0.94, w*0.56, 6, 0,0,Math.PI*2); ctx.fill();

  // nitro exhaust flames
  if (player.boosting && state==="play") {
    for(const bx of [x+w*0.34, x+w*0.66]){
      const fl=12+Math.abs(Math.sin(clock*38+bx))*16;
      const fg=ctx.createLinearGradient(0,y+h*0.9,0,y+h*0.9+fl);
      fg.addColorStop(0,"rgba(255,255,255,0.95)"); fg.addColorStop(0.35,"rgba(130,190,255,0.9)"); fg.addColorStop(1,"rgba(40,80,255,0)");
      ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(bx-5,y+h*0.9); ctx.lineTo(bx+5,y+h*0.9); ctx.lineTo(bx,y+h*0.9+fl); ctx.closePath(); ctx.fill();
    }
  }

  // rear tyres (wide)
  ctx.fillStyle="#0a0a0d"; ctx.fillRect(x-3, y+h*0.5, 12, h*0.42); ctx.fillRect(x+w-9, y+h*0.5, 12, h*0.42);
  ctx.fillStyle="#2b2e36"; ctx.fillRect(x-3, y+h*0.5, 12, h*0.12); ctx.fillRect(x+w-9, y+h*0.5, 12, h*0.12);

  // diffuser
  ctx.fillStyle="#15171e"; ctx.fillRect(x+6, y+h*0.86, w-12, h*0.14);
  for(let i=0;i<5;i++){ ctx.fillStyle="#262a34"; ctx.fillRect(x+10+i*(w-20)/5, y+h*0.86, 2, h*0.14); }

  // body — trapezoid (wider at base)
  const topIn=w*0.12;
  ctx.beginPath(); ctx.moveTo(x+topIn, y+h*0.14); ctx.lineTo(x+w-topIn, y+h*0.14);
  ctx.lineTo(x+w-2, y+h*0.9); ctx.lineTo(x+2, y+h*0.9); ctx.closePath();
  const bg=ctx.createLinearGradient(0,y+h*0.14,0,y+h*0.9);
  bg.addColorStop(0,shade(pColor,75)); bg.addColorStop(0.28,shade(pColor,30));
  bg.addColorStop(0.62,pColor); bg.addColorStop(1,shade(pColor,-60));
  ctx.fillStyle=bg; ctx.fill();
  // specular shoulder
  ctx.fillStyle="rgba(255,255,255,0.22)"; ctx.fillRect(x+topIn, y+h*0.18, w-2*topIn, 2);

  // spoiler (raised wing)
  ctx.fillStyle="#181b23"; ctx.fillRect(x+4, y+h*0.02, 5, h*0.16); ctx.fillRect(x+w-9, y+h*0.02, 5, h*0.16);
  ctx.fillStyle="#20242e"; ctx.fillRect(x, y, w, h*0.06);
  ctx.fillStyle="rgba(255,255,255,0.14)"; ctx.fillRect(x, y, w, 1);

  // rear window
  const winW=w*0.6, winX=cx-winW/2, winY=y+h*0.2, winH=h*0.24;
  ctx.fillStyle="#0c0f16"; ctx.fillRect(winX,winY,winW,winH);
  const wg=ctx.createLinearGradient(0,winY,0,winY+winH);
  wg.addColorStop(0,"rgba(160,200,240,0.6)"); wg.addColorStop(1,"rgba(30,45,70,0.55)");
  ctx.fillStyle=wg; ctx.fillRect(winX+1,winY+1,winW-2,winH-2);

  // tail-light bar with glow
  const tlY=y+h*0.58, tlH=h*0.17;
  ctx.fillStyle=shade(pColor,-70); ctx.fillRect(x+4, tlY-1, w-8, tlH+2);
  const braking=K.brake && state==="play";
  function tl(lx,lw){
    const rg=ctx.createLinearGradient(0,tlY,0,tlY+tlH);
    rg.addColorStop(0,braking?"#ffb0a0":"#ff8a6a"); rg.addColorStop(0.5,braking?"#ff1000":"#ff2a18"); rg.addColorStop(1,"#8c0000");
    ctx.fillStyle=rg; ctx.fillRect(lx,tlY,lw,tlH);
    ctx.globalAlpha=braking?0.8:0.5; ctx.fillStyle="rgba(255,50,30,1)"; ctx.fillRect(lx,tlY+tlH*0.25,lw,tlH*0.5); ctx.globalAlpha=1;
  }
  tl(x+w*0.1, w*0.28); tl(x+w*0.62, w*0.28);
  ctx.fillStyle="rgba(190,20,20,0.7)"; ctx.fillRect(x+w*0.38, tlY+tlH*0.3, w*0.24, tlH*0.4);

  // plate
  ctx.fillStyle="#e6ebf3"; ctx.fillRect(cx-9, y+h*0.78, 18, 6);
  ctx.fillStyle="#4a5464"; ctx.font="700 5px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("ENDURO", cx, y+h*0.78+3);

  ctx.restore();
}

// ---- Weather -----------------------------------------------------------------
let rainDrops=[], snowFlakes=[];
function initParticles() {
  rainDrops=[]; snowFlakes=[];
  for(let i=0;i<90;i++) rainDrops.push({x:Math.random()*W, y:Math.random()*H, s:3+Math.random()*4, len:6+Math.random()*8});
  for(let i=0;i<70;i++) snowFlakes.push({x:Math.random()*W, y:Math.random()*H, s:0.4+Math.random()*0.9, d:Math.random()*Math.PI*2});
}
initParticles();
function drawWeather(t,horizon) {
  const phase=PHASE_ORDER[phaseIdx];
  const spd=state==="play"&&!paused?(0.3+player.speed/MAX_SPEED):0.4;
  const haze=ctx.createLinearGradient(0,horizon-12,0,horizon+46);
  haze.addColorStop(0,hexA(t.fog,0.85)); haze.addColorStop(1,hexA(t.fog,0));
  ctx.fillStyle=haze; ctx.fillRect(0,horizon-12,W,60);

  if (phase==="rain") {
    // wet darkening + reflected headlight pool
    ctx.fillStyle="rgba(10,16,28,0.28)"; ctx.fillRect(0,horizon,W,H-horizon);
    const pool=ctx.createLinearGradient(0,H-70,0,H);
    pool.addColorStop(0,"rgba(150,180,230,0)"); pool.addColorStop(1,"rgba(150,180,230,0.14)");
    ctx.fillStyle=pool; ctx.fillRect(W/2-70,H-70,140,70);
    // rain streaks
    ctx.strokeStyle="rgba(180,200,235,0.5)"; ctx.lineWidth=1;
    for(const d of rainDrops){
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-2,d.y+d.len); ctx.stroke();
      d.y+=d.s*(6+spd*10); d.x-=2;
      if (d.y>H){ d.y=-d.len; d.x=Math.random()*W+20; }
      if (d.x<0) d.x+=W;
    }
    ctx.fillStyle="rgba(120,140,180,0.06)"; ctx.fillRect(0,0,W,H);
  }
  if (phase==="fog") {
    const g=ctx.createLinearGradient(0,horizon-6,0,horizon+60);
    g.addColorStop(0,"rgba(180,188,202,0.95)"); g.addColorStop(1,"rgba(180,188,202,0)");
    ctx.fillStyle=g; ctx.fillRect(0,horizon-6,W,70);
    ctx.fillStyle="rgba(180,188,202,0.18)"; ctx.fillRect(0,0,W,H);
  }
  if (phase==="snow") {
    ctx.fillStyle="rgba(255,255,255,0.9)";
    for(const f of snowFlakes){ ctx.fillRect(f.x|0,f.y|0,1+(f.s>0.9?1:0),1+(f.s>0.9?1:0)); f.y+=f.s*(1+spd); f.x+=Math.sin(f.d+f.y*0.05)*0.6; if(f.y>H){f.y=-2;f.x=Math.random()*W;} }
    ctx.fillStyle="rgba(210,224,240,0.12)"; ctx.fillRect(0,0,W,H);
  }
  if (phase==="dusk"||phase==="night"||phase==="rain") {
    const g=ctx.createRadialGradient(W/2,H*0.6,40,W/2,H*0.6,W*0.7);
    g.addColorStop(0,"rgba(0,0,10,0)");
    g.addColorStop(1, phase==="night"?"rgba(0,0,10,0.55)":phase==="rain"?"rgba(0,4,16,0.5)":"rgba(20,0,30,0.3)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if (phase==="night"||phase==="rain") {
      ctx.fillStyle="rgba(255,250,210,0.06)";
      ctx.beginPath(); ctx.moveTo(W/2-10,H-40); ctx.lineTo(W/2-70,horizon+20); ctx.lineTo(W/2+70,horizon+20); ctx.lineTo(W/2+10,H-40); ctx.closePath(); ctx.fill();
    }
  }
}

// ---- HUD ---------------------------------------------------------------------
function px(text,x,y,size,color,align) {
  ctx.font=`800 ${size}px Arial, "Arial Black", sans-serif`;
  ctx.textAlign=align||"left"; ctx.textBaseline="top"; ctx.lineJoin="round"; ctx.miterLimit=2;
  ctx.lineWidth=Math.max(2,size*0.32); ctx.strokeStyle="rgba(0,0,0,0.9)"; ctx.strokeText(text,x,y);
  ctx.fillStyle=color; ctx.fillText(text,x,y);
}
function drawMinimap() {
  const bw=60, bh=40, bx=W-bw-6, by=23;
  ctx.fillStyle="rgba(6,8,24,0.7)"; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle="rgba(90,120,255,0.5)"; ctx.lineWidth=1; ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  const spanX=Math.max(1,mapMaxX-mapMinX), spanY=Math.max(1,mapMaxY-mapMinY);
  const pad=5, sc=Math.min((bw-pad*2)/spanX,(bh-pad*2)/spanY);
  const ox=bx+bw/2-((mapMinX+mapMaxX)/2)*sc, oy=by+bh/2+((mapMinY+mapMaxY)/2)*sc;
  const MX=p=>ox+p*sc, MY=p=>oy-p*sc;
  ctx.strokeStyle="rgba(150,180,255,0.55)"; ctx.lineWidth=1.4; ctx.beginPath();
  for(let i=0;i<segments.length;i+=3){ const s=segments[i]; const px2=MX(s.mx), py2=MY(s.my); if(i===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2); }
  ctx.stroke();
  // police dots
  for(const c of police){ const s=findSegment(c.z); const on=Math.floor(clock*8)%2===0; ctx.fillStyle=on?"#ff3a3a":"#3a7aff"; ctx.beginPath(); ctx.arc(MX(s.mx),MY(s.my),2,0,Math.PI*2); ctx.fill(); }
  // player dot
  const ps=findSegment(player.z); ctx.fillStyle="#ffe08a"; ctx.beginPath(); ctx.arc(MX(ps.mx),MY(ps.my),2.2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#000"; ctx.lineWidth=0.6; ctx.stroke();
}
function drawHUD(t) {
  ctx.fillStyle="rgba(6,8,24,0.72)"; ctx.fillRect(0,0,W,20);
  ctx.fillStyle="rgba(90,120,255,0.5)"; ctx.fillRect(0,20,W,1);
  px(`DIA ${day}`, 4, 5, 9, "#8ad0ff");
  px(curTheme().name, W/2, 5, 8, "#c8d4ff", "center");
  px(`${score}`, W-4, 5, 9, "#ffe08a", "right");

  // faltam gauge
  const remain=Math.max(0,carsToPass-carsPassed), gy=24;
  ctx.fillStyle="rgba(6,8,24,0.55)"; ctx.fillRect(4,gy,92,13);
  px(remain>0?`FALTAM ${remain}`:"COMPLETO!", 8, gy+2, 8, remain>0?"#ff9a6a":"#7fffb0");

  // position
  px(`POS ${position}/${cars.length+1}`, 4, gy+15, 8, "#c8d4ff");

  // heat / wanted
  const hbw=100, hbx=4, hby=gy+40;
  px("PROCURADO", hbx, hby-10, 7, chasing?"#ff6a6a":"#9aa8dd");
  ctx.fillStyle="rgba(6,8,24,0.6)"; ctx.fillRect(hbx,hby,hbw,6);
  const hg=ctx.createLinearGradient(hbx,0,hbx+hbw,0); hg.addColorStop(0,"#ffd24a"); hg.addColorStop(1,"#ff3a3a");
  ctx.fillStyle=chasing?"#ff3a3a":hg; ctx.fillRect(hbx,hby,hbw*(chasing?1:heat),6);
  ctx.strokeStyle="rgba(150,190,255,0.5)"; ctx.lineWidth=1; ctx.strokeRect(hbx+0.5,hby+0.5,hbw-1,5);
  // wanted stars
  for(let i=0;i<5;i++){ px("★", hbx+i*10, hby+8, 8, i<wanted?"#ffd24a":"#3a3f55"); }

  // bust meter while chased
  if (chasing) {
    const on=Math.floor(clock*6)%2===0;
    px("POLÍCIA", W/2, 24, 10, on?"#ff5a4a":"#ffd24a", "center");
    const bmw=120, bmx=W/2-bmw/2, bmy=40;
    ctx.fillStyle="rgba(6,8,24,0.6)"; ctx.fillRect(bmx,bmy,bmw,6);
    ctx.fillStyle="#ff3a3a"; ctx.fillRect(bmx,bmy,bmw*bustMeter,6);
    ctx.strokeStyle="rgba(255,150,150,0.6)"; ctx.lineWidth=1; ctx.strokeRect(bmx+0.5,bmy+0.5,bmw-1,5);
    px("CAPTURA", W/2, bmy+8, 6, "#ff9a9a", "center");
    if (escapeTimer>0) px("DESPISTANDO...", W/2, bmy+18, 8, "#7fffb0", "center");
  }

  drawMinimap();

  // speedometer
  const gx=W-40, gy2=H-38, gr=30;
  const a0=Math.PI*0.75, a1=Math.PI*2.25;
  const frac=Math.min(1.15,player.speed/MAX_SPEED)/1.15;
  ctx.beginPath(); ctx.arc(gx,gy2,gr,0,Math.PI*2); ctx.fillStyle="rgba(6,8,24,0.72)"; ctx.fill();
  ctx.lineWidth=4; ctx.lineCap="round"; ctx.strokeStyle="rgba(90,120,200,0.35)";
  ctx.beginPath(); ctx.arc(gx,gy2,gr-4,a0,a1); ctx.stroke();
  ctx.strokeStyle=player.boosting?"#7ab8ff":frac>0.8?"#ff5a4a":frac>0.5?"#ffd24a":"#5affa0";
  ctx.beginPath(); ctx.arc(gx,gy2,gr-4,a0,a0+(a1-a0)*frac); ctx.stroke(); ctx.lineCap="butt";
  const na=a0+(a1-a0)*frac;
  ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(gx,gy2); ctx.lineTo(gx+Math.cos(na)*(gr-7),gy2+Math.sin(na)*(gr-7)); ctx.stroke();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(gx,gy2,2,0,Math.PI*2); ctx.fill();
  const spd=Math.floor(player.speed/MAX_SPEED*310);
  px(`${spd}`, gx, gy2-8, 13, "#ffffff", "center");
  px("KM/H", gx, gy2+5, 6, "#8ad0ff", "center");
  const gear=Math.min(6,1+Math.floor(player.speed/MAX_SPEED*6));
  px("MARCHA "+gear, gx, gy2-gr-11, 8, "#ffe08a", "center");
  if (player.boosting) px("TURBO!", gx, gy2+gr+2, 8, "#7ab8ff", "center");

  // nitro bar
  const nbw=92, nbx=6, nby=H-13;
  px("NITRO", nbx, nby-11, 8, "#8ad0ff");
  ctx.fillStyle="rgba(6,8,24,0.6)"; ctx.fillRect(nbx,nby,nbw,8);
  const ng=ctx.createLinearGradient(nbx,0,nbx+nbw,0); ng.addColorStop(0,"#2a6bff"); ng.addColorStop(1,"#9fe0ff");
  ctx.fillStyle=player.boosting?"#dff0ff":ng; ctx.fillRect(nbx,nby,nbw*player.nitro,8);
  ctx.strokeStyle="rgba(150,190,255,0.6)"; ctx.lineWidth=1; ctx.strokeRect(nbx+0.5,nby+0.5,nbw-1,7);

  // live drift score
  if (drifting && driftScore>40) { px("DRIFT "+(driftScore|0), W/2, H-30, 12, "#ffd24a", "center"); }

  // combo
  if (combo>=2 && comboTimer>0){ ctx.globalAlpha=Math.min(1,comboTimer); px(`COMBO x${combo}`, W/2, H*0.56, 12, "#ffd24a", "center"); ctx.globalAlpha=1; }
  if (muted) px("SOM: OFF (M)", 6, 12, 6, "#9aa8dd");

  if (flashTimer>0 && !chasing){ ctx.globalAlpha=Math.min(1,flashTimer); px(flashMsg, W/2, H*0.30, 13, flashCol, "center"); ctx.globalAlpha=1; }
  else if (flashTimer>0 && chasing && flashMsg!=="POLÍCIA!"){ ctx.globalAlpha=Math.min(1,flashTimer); px(flashMsg, W/2, H*0.62, 12, flashCol, "center"); ctx.globalAlpha=1; }
  if (crashTimer>0){ ctx.globalAlpha=Math.min(1,crashTimer); px("BATIDA!", W/2, H*0.30, 13, "#ff5a4a", "center"); ctx.globalAlpha=1; }
}

// ---- Panels ------------------------------------------------------------------
function panel(title, lines, accent) {
  ctx.fillStyle="rgba(4,6,18,0.82)"; ctx.fillRect(0,0,W,H);
  px(title, W/2, H*0.12, 24, accent, "center");
  ctx.fillStyle=accent; ctx.fillRect(W/2-100,H*0.26,200,2);
  let total=0; for(const ln of lines) total+=(ln.s||9)+5;
  let y=H*0.32+Math.max(0,(H*0.52-total)/2);
  for(const ln of lines){ px(ln.t,W/2,y,ln.s||9,ln.c||"#dfe8ff","center"); y+=(ln.s||9)+5; }
}

function drawGarage() {
  ctx.fillStyle="rgba(4,6,18,0.9)"; ctx.fillRect(0,0,W,H);
  px("GARAGEM", W/2, 12, 18, "#8ad0ff", "center");

  pColor=CAR_TINTS[selPaint].hex;
  const cx=W/2, cy=116;
  // platform
  ctx.fillStyle="rgba(120,160,255,0.12)"; ctx.beginPath(); ctx.ellipse(cx,cy+26,90,14,0,0,Math.PI*2); ctx.fill();
  drawPreviewCar(cx,cy,168,selPaint);
  // arrows
  px("◀", 20, cy-8, 20, "#c8d4ff", "center");
  px("▶", W-20, cy-8, 20, "#c8d4ff", "center");
  // name + tag
  px(car.name, W/2, 150, 14, "#ffe08a", "center");
  px(car.tag, W/2, 166, 8, "#7ab8ff", "center");
  // stat bars
  const stats=[["VEL",car.top/1.2],["ACEL",car.accel/1.3],["MANOBRA",car.grip/1.2]];
  let sy=180;
  for(const [lab,v] of stats){
    px(lab, 70, sy, 7, "#9aa8dd", "right");
    ctx.fillStyle="rgba(6,8,24,0.7)"; ctx.fillRect(78,sy,120,6);
    ctx.fillStyle="#5affa0"; ctx.fillRect(78,sy,120*clamp(v,0.1,1),6);
    ctx.strokeStyle="rgba(150,190,255,0.4)"; ctx.lineWidth=1; ctx.strokeRect(78.5,sy+0.5,119,5);
    sy+=11;
  }
  // paint swatches
  const totalW=CAR_TINTS.length*16, px0=W/2-totalW/2;
  px("COR", px0-8, 216, 7, "#9aa8dd", "right");
  for(let i=0;i<CAR_TINTS.length;i++){
    const xx=px0+i*16;
    ctx.fillStyle=CAR_TINTS[i].hex; ctx.fillRect(xx,214,12,10);
    if (i===selPaint){ ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.strokeRect(xx-1,213,14,12); }
  }
  px(blink()?"▶ ENTER / TOQUE: CORRER":" ", W/2, 228, 9, "#ffe08a", "center");
}
function drawPreviewCar(cx,cy,w,tint) {
  if (spriteReady) {
    const ih=w*spriteH/spriteW, ix=cx-w/2, iy=cy-ih/2;
    ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(cx,cy+ih*0.42,w*0.46,8,0,0,Math.PI*2); ctx.fill();
    ctx.drawImage(tintCanvas[tint]||tintCanvas[0], ix, iy, w, ih);
    return;
  }
  const color = CAR_TINTS[tint] ? CAR_TINTS[tint].hex : "#cccccc";
  const h=w*0.56, x=cx-w/2, y=cy-h*0.55;
  ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(cx,y+h*0.96,w*0.54,9,0,0,Math.PI*2); ctx.fill();
  // tyres
  ctx.fillStyle="#0a0a0d"; ctx.fillRect(x-4,y+h*0.5,16,h*0.44); ctx.fillRect(x+w-12,y+h*0.5,16,h*0.44);
  ctx.fillStyle="#2b2e36"; ctx.fillRect(x-4,y+h*0.5,16,h*0.12); ctx.fillRect(x+w-12,y+h*0.5,16,h*0.12);
  // diffuser
  ctx.fillStyle="#15171e"; ctx.fillRect(x+8,y+h*0.86,w-16,h*0.14);
  // body trapezoid
  const topIn=w*0.12;
  ctx.beginPath(); ctx.moveTo(x+topIn,y+h*0.12); ctx.lineTo(x+w-topIn,y+h*0.12); ctx.lineTo(x+w-2,y+h*0.9); ctx.lineTo(x+2,y+h*0.9); ctx.closePath();
  const bg=ctx.createLinearGradient(0,y+h*0.12,0,y+h*0.9);
  bg.addColorStop(0,shade(color,78)); bg.addColorStop(0.28,shade(color,32)); bg.addColorStop(0.62,color); bg.addColorStop(1,shade(color,-60));
  ctx.fillStyle=bg; ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.22)"; ctx.fillRect(x+topIn,y+h*0.16,w-2*topIn,2);
  // spoiler
  ctx.fillStyle="#181b23"; ctx.fillRect(x+6,y+h*0.02,6,h*0.14); ctx.fillRect(x+w-12,y+h*0.02,6,h*0.14);
  ctx.fillStyle="#20242e"; ctx.fillRect(x,y,w,h*0.05);
  // window
  const winW=w*0.6, winX=cx-winW/2, winY=y+h*0.18, winH=h*0.24;
  ctx.fillStyle="#0c0f16"; ctx.fillRect(winX,winY,winW,winH);
  const gg=ctx.createLinearGradient(0,winY,0,winY+winH); gg.addColorStop(0,"rgba(170,205,240,0.7)"); gg.addColorStop(1,"rgba(30,45,70,0.55)");
  ctx.fillStyle=gg; ctx.fillRect(winX+1,winY+1,winW-2,winH-2);
  // tail lights
  const tlY=y+h*0.58, tlH=h*0.16;
  ctx.fillStyle=shade(color,-70); ctx.fillRect(x+4,tlY-1,w-8,tlH+2);
  for(const lx of [x+w*0.1, x+w*0.62]){
    const rg=ctx.createLinearGradient(0,tlY,0,tlY+tlH); rg.addColorStop(0,"#ff9a7a"); rg.addColorStop(0.5,"#ff2a18"); rg.addColorStop(1,"#8c0000");
    ctx.fillStyle=rg; ctx.fillRect(lx,tlY,w*0.28,tlH);
  }
  ctx.fillStyle="#e6ebf3"; ctx.fillRect(cx-11,y+h*0.78,22,7);
}

let clock=0;
function blink(){ return Math.floor(clock*2)%2===0; }

// ---- Attract demo ------------------------------------------------------------
function initDemo() {
  buildTrack(4242); resetCars();
  player.x=0; player.z=0; player.speed=MAX_SPEED*0.55;
  phaseIdx=1; phaseTime=0;
}
initDemo();

// ---- Main loop ---------------------------------------------------------------
let last=performance.now();
function frame(now) {
  let dt=(now-last)/1000; last=now;
  if (dt>0.05) dt=0.05; if (dt<0) dt=0;
  clock+=dt;
  update(dt);
  if (state!=="play"||paused) player.boosting=false;
  const targetDepth=(state==="play"&&player.boosting)?CAM_DEPTH*0.82:CAM_DEPTH;
  camDepth+=(targetDepth-camDepth)*Math.min(1,dt*6);
  updateAudio();
  if (state==="menu"||state==="garage") {
    player.z+=player.speed*dt; while(player.z>=trackLength) player.z-=trackLength;
    if (state==="menu") player.x=Math.sin(clock*0.6)*0.4;
    phaseTime+=dt; if (phaseTime>=PHASE_DURATION){ phaseTime=0; phaseIdx=(phaseIdx+1)%PHASE_ORDER.length; }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
