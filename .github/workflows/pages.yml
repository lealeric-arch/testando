name: Deploy web (GitHub Pages)

# Publica a versão web do app no GitHub Pages para uso no navegador do celular.
# A raiz "/" serve o app; o jogo Enduro 2026 é publicado em "/enduro-2026/".
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/pc-auction-control-259bzg

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (web / Pages)
        env:
          DEPLOY_TARGET: pages
        run: npm run build

      - name: Incluir jogo Enduro 2026 (PWA) em /enduro-2026/
        run: cp -r enduro-2026 dist/enduro-2026

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
