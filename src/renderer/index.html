<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Entre Colunas Leilões</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">EC</div>
        <div class="brand-text">
          <strong>Entre Colunas</strong>
          <span>Controle de Leilões</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="painel">Painel</button>
        <button class="nav-item" data-view="leiloes">Leilões</button>
        <button class="nav-item" data-view="lotes">Lotes / Catálogo</button>
        <button class="nav-item" data-view="clientes">Arrematantes</button>
        <button class="nav-item" data-view="lances">Lances</button>
        <button class="nav-item" data-view="financeiro">Financeiro</button>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-export" class="ghost">Exportar backup</button>
        <button id="btn-import" class="ghost">Importar backup</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="auction-picker">
          <label for="sel-leilao">Leilão ativo</label>
          <select id="sel-leilao"></select>
        </div>
        <div id="topbar-status" class="status"></div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="../calc.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
